version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: ["migrations/"]
    gen:
      go:
        package: "generated"
        out: "generated"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          # The qualified catalog name is the one sqlc matches; a bare
          # `timestamptz` is silently ignored and the column comes back
          # as pgtype.Timestamptz.
          #
          # timestamptz PARAMETERS must not carry a redundant
          # ::TIMESTAMPTZ cast in queries/: an override applies to a
          # catalog-resolved column but not to a cast-typed parameter,
          # so the cast forces pgtype.Timestamptz. Without the cast
          # sqlc infers the parameter type from the bound column.
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
