api:
  dashboard: false

log:
  level: INFO

# docref: begin safe-access-log
accessLog:
  format: json
  fields:
    names:
      # Traefik 3.7.1 cannot remove only the query component, so omit both
      # fields that contain the request URI. Method, host, status, timing,
      # router, service, and client metadata remain available.
      RequestPath: drop
      RequestLine: drop
    headers:
      defaultMode: drop
# docref: end safe-access-log

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: false

certificatesResolvers:
  letsencrypt:
    acme:
      # The challenge type is per deployment, not per image: setup.sh renders it
      # into config/traefik-acme.env from ACME_CHALLENGE. A challenge pinned
      # here would win for every deployment, including the dns01 ones that
      # cannot answer on port 80 in the first place.
      storage: /letsencrypt/acme.json
