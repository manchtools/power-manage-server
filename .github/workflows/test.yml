name: Tests

on:
  push:
    branches: [main, 'v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 30m ./...
      - run: go vet ./...
      - run: bash deploy/setup_test.sh
      - run: bash deploy/backup_test.sh
