name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve SDK ref
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --tags https://github.com/MANCHTOOLS/power-manage-sdk.git "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: MANCHTOOLS/power-manage-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: _sdk
      - run: go mod edit -replace github.com/manchtools/power-manage-sdk=./_sdk
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - name: Resolve SDK ref
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --tags https://github.com/MANCHTOOLS/power-manage-sdk.git "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: MANCHTOOLS/power-manage-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: _sdk
      - run: go mod edit -replace github.com/manchtools/power-manage-sdk=./_sdk
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build control
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o dist/control-linux-${{ matrix.arch }} ./cmd/control
      - uses: actions/upload-artifact@v5
        with:
          name: control-${{ matrix.arch }}
          path: dist/control-linux-${{ matrix.arch }}

  containers:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: control-${{ matrix.arch }}
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push control image
        run: |
          chmod +x dist/control-linux-${{ matrix.arch }}
          docker build --provenance=false -f deploy/Containerfile.control \
            --build-arg BINARY=dist/control-linux-${{ matrix.arch }} \
            -t ghcr.io/manchtools/power-manage-control:${GITHUB_REF_NAME#v}-${{ matrix.arch }} .
          docker push ghcr.io/manchtools/power-manage-control:${GITHUB_REF_NAME#v}-${{ matrix.arch }}

  smoke:
    needs: containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployed target
        env:
          IMAGE_TAG: ${{ github.ref_name }}-amd64
        run: |
          IMAGE_TAG="${IMAGE_TAG#v}" bash deploy/smoke-test.sh

  manifests:
    needs: [build, containers, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and channel manifests
        env:
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image=ghcr.io/manchtools/power-manage-control
          docker manifest create "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          docker manifest push "$image:$version"
          channel=latest
          if [[ "$PRERELEASE" == true ]]; then channel=latest-rc; fi
          docker manifest create --amend "$image:$channel" "$image:$version-amd64" "$image:$version-arm64"
          docker manifest push "$image:$channel"

  release:
    needs: [build, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: control-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum control-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Power Manage Server ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
