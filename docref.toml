# docref keeps deploy/operator prose honest against the code it describes.
# `docref check` (run in CI) fails when an anchored snippet or claim drifts from
# the symbol/region it points at — e.g. the `control backup-status` subcommand
# name, its non-zero exit when the last verified backup is stale, or the fields
# of the status document it prints.
[scan]
include = ["deploy/QUICKSTART.md", "SECURITY.md", "README.md", "cmd/control/README.md"]

[check]
level = "strict"
